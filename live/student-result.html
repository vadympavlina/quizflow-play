<body>
<div id="content"><div class="waiting"><div><div class="spinner"></div>Підраховуємо результати…</div></div></div>

<script type="module">
const MIC = {search:"<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/></svg>",alert:"<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>"};
import {
  db, ref, get, onValue, readParams, isValidCode, esc, standings,
  plural, fmtNum, pageUrl, avatarInner, avatarInfo, avatarFill, initialsOf,
} from "./live-core.js?v=19";
import { SND, NOTE, reduced } from "./results-fx.js?v=2";

const $ = (id) => document.getElementById(id);
const { code, pid, nickname: nickParam } = readParams("code", "pid", "nickname");
if (!isValidCode(code) || !pid) { location.replace(pageUrl("../")); throw new Error("bad params"); }
const joinAgain = pageUrl("../");

function message(ico, title, text) {
  $("content").innerHTML = `<div class="waiting"><div><div style="display:grid;place-items:center">${MIC[ico] || MIC.alert}</div><h2>${esc(title)}</h2>${esc(text)}
    <div><a class="btn" href="${esc(joinAgain)}">Приєднатись до гри</a></div></div></div>`;
}

// Чекаємо, поки викладач завершить гру (слухаємо лише статус, а не всю кімнату)
let done = false;
const unsub = onValue(ref(db, `rooms/${code}/status`), async snap => {
  if (done) return;
  const status = snap.val();
  if (!status) { done = true; unsub(); message("search", "Гру не знайдено", "Можливо, кімнату вже видалено."); return; }
  if (status !== "leaderboard" && status !== "finished") {
    // Гра ще триває (наприклад, учень відкрив посилання завчасно) — повертаємо в гру
    location.replace(`play-student?code=${code}&pid=${encodeURIComponent(pid)}&nickname=${encodeURIComponent(nickParam || "")}`);
    return;
  }
  done = true; unsub();
  try { await render(); }
  catch (e) { console.error(e); message("alert", "Не вдалося завантажити результати", e.message); }
});

async function render() {
  const [qS, pS, aS, tS, scS] = await Promise.all(["questions", "players", "answers", "testTitle", "scoring"].map(p => get(ref(db, `rooms/${code}/${p}`))));
  const totalQ = (qS.val() || []).length;
  const accMode = scS.val() === "correct";   // «Точність»: у підсумку кількість правильних, а не бали
  const allAns = aS.val() || {};
  const list = standings(pS.val(), allAns);
  const meRow = list.find(p => p.pid === pid);
  const nickname = meRow?.nickname || pS.val()?.[pid]?.nickname || nickParam || "Гравець";
  const title = tS.val() || "";

  const mine = {};
  Object.entries(allAns).forEach(([qi, qA]) => { if (qA?.[pid]) mine[+qi] = qA[pid]; });
  const correct = Object.values(mine).filter(a => a.isCorrect).length;
  const place = meRow?.rank;
  const val = p => accMode ? p.correct : p.score;
  const S = p => accMode ? `${p.correct} / ${totalQ}` : fmtNum(p.score);

  // ── Місце серед інших: лідер, сусіди, ви ──
  const meI = meRow ? list.indexOf(meRow) : -1;
  const show = new Set([0]);
  if (meI >= 0) { [meI - 1, meI, meI + 1].forEach(i => show.add(i)); if (meI <= 2) [0, 1, 2].forEach(i => show.add(i)); }
  else [1, 2].forEach(i => show.add(i));
  const idx = [...show].filter(i => i >= 0 && i < list.length).sort((a, b) => a - b);
  const gw = n => `ще ${n} ${plural(n, "гравець", "гравці", "гравців")}`;
  const above = meI > 0 ? list.slice(0, meI).reverse().find(p => p.rank < place) : null;
  const gap = above ? val(above) - val(meRow) : 0;
  const delta = p => { const d = val(p) - (meRow ? val(meRow) : 0); if (!d) return ""; return d > 0 ? "+" + (accMode ? d : fmtNum(d)) : "−" + (accMode ? -d : fmtNum(-d)); };
  const fmtVal = (p, f = 1) => accMode ? `${Math.round(p.correct * f)} / ${totalQ}` : fmtNum(Math.round(p.score * f));
  const ptsWord = accMode ? "правильних" : "балів";
  const th = s => esc(s).replace(/[   ]/g, '<span class="ts"></span>');
  const tie = place ? list.filter(p => p.rank === place).length : 0;
  const placeOf = r => r === 3 ? "3-є" : r + "-е";
  const rank = place && place <= 3 ? place : 0;
  const gapTxt = !meRow ? "" : place === 1 ? (accMode ? `${totalQ ? Math.round(correct / totalQ * 100) : 0}% правильно` : `${correct} з ${totalQ} правильно`)
    : !above ? "" : accMode ? `До ${above.rank} місця: ${gap} ${plural(gap, "відповідь", "відповіді", "відповідей")}` : `До ${above.rank} місця: ${fmtNum(gap)} ${plural(gap, "бал", "бали", "балів")}`;
  const lab = !place ? "Результат" : tie > 1 ? `Ділите ${placeOf(place)} місце · ${tie} ${plural(tie, "гравець", "гравці", "гравців")}`
    : place === 1 ? "Переможець" : place === 2 ? "Друге місце" : place === 3 ? "Третє місце" : `${placeOf(place)} місце із ${list.length} ${plural(list.length, "гравця", "гравців", "гравців")}`;

  // ── Палітри й фігури ──
  const PAL = {
    0: { fg: "#ffffff", ghost: "rgba(255,255,255,.07)", halo: "rgba(255,255,255,.12)", a: "#3fe0b0", b: "#ffd54a", c: "#ff8fb8" },
    3: { fg: "#ffffff", ghost: "rgba(255,255,255,.08)", halo: "rgba(255,255,255,.14)", a: "#ff7a59", b: "#ffd54a", c: "#8fe9ff" },
    2: { fg: "#ffffff", ghost: "rgba(255,255,255,.08)", halo: "rgba(255,255,255,.14)", a: "#3fe0b0", b: "#ffd54a", c: "#ff8fb8" },
    1: { fg: "#0b1033", ghost: "rgba(11,16,51,.07)", halo: "rgba(255,255,255,.38)", a: "#ff6b4a", b: "#ffffff", c: "#3d6bff" },
  };
  const SHAPES = {
  3: [["c", -120, 560, 520, "a", .5, 0], ["r", 1250, -260, 380, "b", .8, .02, { w: 16 }], ["p", 1640, 640, 90, "b", 1.1, .05], ["t", 860, 600, 120, "c", 1.3, .04], ["d", 560, 670, 240, "c", .4, 0], ["c", 1760, 330, 60, "b", 1.6, 0], ["p", 60, 70, 64, "c", 1.2, -.04], ["r", 1000, 690, 110, "a", 1.5, -.03, { w: 10 }]],
  2: [["c", 1450, -100, 460, "a", .5, 0], ["r", -330, 560, 420, "b", .8, -.02, { w: 16 }], ["p", 1100, 70, 80, "b", 1.1, .05], ["t", 1780, 620, 130, "c", 1.3, -.04], ["d", 620, 660, 240, "a", .4, 0], ["c", 860, 700, 70, "b", 1.6, 0], ["p", 1690, 380, 60, "c", 1.2, .04], ["r", 600, -40, 120, "c", 1.4, .03, { w: 10 }]],
  1: [["c", 1380, -90, 520, "b", .5, 0], ["r", -340, 570, 430, "a", .8, .02, { w: 16 }], ["p", 1690, 610, 100, "c", 1.1, .05], ["t", 900, 640, 120, "a", 1.3, .04], ["d", 560, 670, 240, "c", .4, 0], ["c", 1790, 300, 64, "a", 1.6, 0], ["p", 70, 80, 70, "c", 1.2, -.04], ["r", 1060, 70, 120, "c", 1.5, -.03, { w: 10 }]],
};
// на вузькому екрані фігур менше й вони лише по краях: не налазять на ім'я, рахунок і медальйони
const PORT_SHAPES = {
  3: [["c", -190, 1360, 380, "a", .5, 0], ["r", 800, -130, 320, "b", .8, .02, { w: 14 }], ["p", 60, 250, 70, "c", 1.2, -.04], ["c", 975, 1110, 46, "b", 1.6, 0], ["p", 950, 1560, 70, "b", 1.1, .05]],
  2: [["c", 780, -150, 380, "a", .5, 0], ["r", -170, 1330, 340, "b", .8, -.02, { w: 14 }], ["p", 940, 1090, 70, "b", 1.1, .05], ["c", 40, 250, 46, "c", 1.6, 0], ["p", 40, 1590, 70, "c", 1.2, .04]],
  1: [["c", 790, -140, 380, "b", .5, 0], ["r", -180, 1340, 340, "a", .8, .02, { w: 14 }], ["p", 935, 1100, 70, "c", 1.1, .05], ["c", 40, 250, 46, "a", 1.6, 0], ["p", 945, 1580, 70, "c", 1.2, .04]],
};
  SHAPES[0] = SHAPES[2]; PORT_SHAPES[0] = PORT_SHAPES[2];

  // ── Вимірювання тексту: ім'я підбирається по ширині ──
  const mc = document.createElement("canvas").getContext("2d");
  const textW = (t, px) => { mc.font = `800 ${px}px Manrope, system-ui, sans-serif`; return mc.measureText(t).width * 0.96; };
  const fitW = (t, max, w, min = 20) => { let s = max; const m = textW(t, s); if (m > w) s = Math.max(min, Math.floor(s * w / m)); return s; };
  const portrait = () => matchMedia("(max-aspect-ratio: 9/10)").matches;

  const info = avatarInfo(meRow?.avatar);
  const disc = d => `<div class="disc" style="--abg:${avatarFill(nickname, meRow?.avatar)}">${info ? avatarInner(nickname, meRow.avatar, { hat: meRow.hat, glasses: meRow.glasses, outfit: meRow.outfit }) : `<span class="ini" style="font-size:${Math.round(d * .36)}px">${esc(initialsOf(nickname))}</span>`}</div>`;
  const tilesHtml = Array.from({ length: totalQ }, (_, i) => { const a = mine[i]; const c = !a ? "" : a.isCorrect ? "y" : "x";
    const mark = c === "y" ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : c === "x" ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' : "";
    return `<i class="${c}" data-o="${!a ? 2 : a.isCorrect ? 1 : 0}" role="img" aria-label="Питання ${i + 1}: ${!a ? "без відповіді" : a.isCorrect ? "правильно" : "неправильно"}">${i + 1}${mark}</i>`; }).join("");
  const ladHtml = (() => { let h = "";
    idx.forEach((i, j) => {
      if (j && i - idx[j - 1] > 1) h += `<li class="gp">${gw(i - idx[j - 1] - 1)}</li>`;
      const p = list[i], me = i === meI, pi = avatarInfo(p.avatar);
      const av = pi ? avatarInner(p.nickname, p.avatar, { hat: p.hat, glasses: p.glasses, outfit: p.outfit }) : `<span class="ini">${esc(initialsOf(p.nickname))}</span>`;
      h += `<li class="${me ? "me" : ""}"><span class="k">${p.rank}</span><span class="av" style="--abg:${avatarFill(p.nickname, p.avatar)}">${av}</span><span class="n">${esc(p.nickname)}</span>${me ? "" : `<span class="d">${esc(delta(p))}</span>`}<span class="s">${esc(accMode ? `${p.correct}/${totalQ}` : fmtNum(p.score))}</span></li>`; });
    if (idx.length && idx[idx.length - 1] < list.length - 1) h += `<li class="gp">${gw(list.length - 1 - idx[idx.length - 1])}</li>`;
    return h; })();

  document.title = `Ваш результат · ${title || "QuizFlow Live"}`;
  $("content").innerHTML = `<div class="T land" id="T" data-phase="init">
    <div class="bgs" id="bgs"></div><div class="stage" id="stage"></div>
    <h1 class="sr">${esc(place ? `Ваш результат: ${place} місце із ${list.length}, ${fmtVal(meRow)} ${ptsWord}` : "Ваш результат")}</h1>
    <section class="panel" id="panel" tabindex="-1" aria-label="Ваші відповіді й місце серед інших"><div class="pn-in">
      <div class="pn-title" id="pn-title">${esc(title || "Гру завершено")}</div>
      <div class="pn-cols">
        <div class="pn-mine">${totalQ ? `<div class="pn-h">Ваші відповіді</div><div class="tiles" id="tiles">${tilesHtml}</div>` : ""}
          ${meRow ? `<div class="sum" id="sum">${accMode ? `Правильно <b>${correct}</b> з ${totalQ}` : `Правильно <b>${correct}</b> з ${totalQ} · <b>${esc(fmtNum(meRow.score))}</b> балів`}</div>` : ""}</div>
        <div class="pn-rest"><div class="pn-h">Місце серед інших</div><ol class="lad" id="lad">${ladHtml}</ol></div>
      </div></div></section>
    <div id="flash"></div><div class="vig"></div>
    <div class="acts"><button class="btn" id="skip" type="button" hidden>Пропустити</button><button class="btn" id="replay" type="button">Ще раз</button><button class="btn" id="snd" type="button"></button><a class="btn primary" href="${esc(joinAgain)}">До нової гри</a></div>
  </div>`;
  const Tel = $("T"), stage = $("stage"), bgs = $("bgs"), panel = $("panel");
  const label = () => { $("snd").textContent = SND.on ? "Звук: вкл" : "Звук: вимк"; };
  label(); $("snd").addEventListener("click", () => { SND.toggle(); label(); });

  // ── Побудова кадру ──
  const CARD_OUT = [3900, 4600], PANEL_IN = [4300, 5000], END = 6600;
  let L = "land", C = null, rows = [];
  function build() {
    const port = portrait(); L = port ? "port" : "land";
    Tel.classList.toggle("port", port); Tel.classList.toggle("land", !port);
    const vw = innerWidth, vh0 = innerHeight, bar = port ? 64 : 0, vh = vh0 - bar, baseW = port ? 1080 : 1920, baseH = port ? 1700 : 1080, k = Math.min(vw / baseW, vh / baseH);
    stage.style.cssText = `width:${vw / k}px;height:${vh / k}px;margin:${-vh / k / 2 - bar / 2}px 0 0 ${-vw / k / 2}px;transform:scale(${k})`;   // у портреті знизу — смужка кнопок, сцена її не перекриває
    stage.innerHTML = ""; bgs.innerHTML = "";
    const pal = PAL[rank], win = rank === 1, shp = (port ? PORT_SHAPES : SHAPES)[rank];
    const fs = fitW(nickname, port ? (win ? 210 : 190) : (win ? 250 : 230), port ? 920 : 900, port ? 70 : 90);
    const bg = document.createElement("div"); bg.className = "bgc"; bg.dataset.rank = rank; bgs.appendChild(bg);
    const shapes = shp.map(s0 => { const [ty, x, y, sz, ck, , , ex] = s0; return `<div class="sh ${ty}" style="left:${x}px;top:${y}px;width:${sz}px;height:${ty === "t" ? sz * .9 : sz}px;--col:${pal[ck]};${ex?.w ? `--w:${ex.w}px;` : ""}"></div>`; }).join("");
    const d = port ? (win ? 700 : 640) : (win ? 540 : 470);
    const el = document.createElement("div"); el.className = "card" + (win ? " win" : ""); el.style.cssText = `--ghost:${pal.ghost};--halo:${pal.halo}`;
    el.innerHTML = `<div class="cc"><div class="ci">${shapes}<div class="ghost">${place || ""}</div><div class="lab">${esc(lab)}</div>
      <div class="name" style="font-size:${fs}px"><div class="ln"><i>${esc(nickname)}</i></div></div><div class="rule"></div>
      <div class="score"><span class="v">${th(meRow ? fmtVal(meRow, 0) : "")}</span>${meRow ? `<small>${esc(ptsWord)}</small>` : ""}</div><div class="gap">${esc(gapTxt)}</div>
      <div class="med solo" style="--d:${d}px"><div class="halo"></div>${disc(d)}<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg></div></div></div>`;
    stage.appendChild(el);
    C = { el, bg, ci: el.querySelector(".ci"), shapes: [...el.querySelectorAll(".sh")], spec: shp, ghost: el.querySelector(".ghost"), lab: el.querySelector(".lab"), line: el.querySelector(".ln>i"), rule: el.querySelector(".rule"),
      score: el.querySelector(".score"), v: el.querySelector(".v"), gap: el.querySelector(".gap"), solo: el.querySelector(".med"), ring: el.querySelector(".ring circle"), halos: [...el.querySelectorAll(".halo")], vs: "" };
    rows = [...panel.querySelectorAll(".pn-title,.pn-h,.tiles i,.sum,.lad li")];
  }

  // ── Час ──
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const P = (t, a, b) => clamp((t - a) / (b - a));
  const eO = x => 1 - Math.pow(1 - x, 4), eO5 = x => 1 - Math.pow(1 - x, 5), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function renderAt(t) {
    const mx = Math.sin(t / 3300) * .5, my = Math.cos(t / 4300) * .3, out = P(t, CARD_OUT[0], CARD_OUT[1]);
    const phase = t >= PANEL_IN[0] ? "panel" : "card"; if (Tel.dataset.phase !== phase) Tel.dataset.phase = phase;
    const fin = P(t, 0, 350);
    C.el.style.visibility = out < 1 ? "visible" : "hidden"; C.el.style.opacity = fin * (1 - out); C.bg.style.opacity = fin;
    C.el.style.transform = out > 0 ? `scale(${1 + out * .04})` : "none"; C.el.style.filter = out > 0 ? `blur(${out * 8}px)` : "none";
    C.shapes.forEach((e2, k) => { const [, , , , , dp, sp] = C.spec[k]; e2.style.transform = `translate(${-mx * 30 * dp + Math.sin(t / (2200 + k * 300) + k) * 10 * dp}px,${-my * 16 * dp + Math.cos(t / (2600 + k * 250) + k) * 8 * dp}px) rotate(${t * sp * .05 + Math.sin(t / 3000 + k) * 3}deg)`; });
    C.ghost.style.opacity = eO(P(t, 0, 900)); C.ghost.style.transform = `translate(${-mx * 14 + (1 - eO(P(t, 0, 1400))) * -60}px,${-my * 8}px)`;
    C.lab.style.opacity = eO(P(t, 150, 650)) * .85; C.lab.style.transform = `translate(${-mx * 8}px,${(1 - eO(P(t, 150, 650))) * 14}px)`;
    C.line.style.transform = `translateY(${(1 - eO5(P(t, 300, 1100))) * 118}%)`;
    C.rule.style.width = eO(P(t, 600, 1500)) * (L === "port" ? 600 : 870) + "px";
    if (meRow) { const str = fmtVal(meRow, eO(P(t, 700, rank === 1 ? 2300 : 2100))); if (C.vs !== str) { C.vs = str; C.v.innerHTML = th(str); } }
    C.score.style.opacity = eO(P(t, 600, 1100));
    C.gap.style.opacity = eO(P(t, 1500, 2100)) * .85;
    const mp = eO5(P(t, 200, 1500));
    C.solo.style.opacity = clamp(P(t, 200, 900)); C.solo.style.transform = `translate(${mx * 26 + (1 - mp) * 90}px,${my * 14}px) scale(${.9 + .1 * mp})`;
    C.ring.style.strokeDashoffset = 100 * (1 - eIO(P(t, 900, 2300)));
    C.halos.forEach(h => { h.style.transform = `scale(${.85 + .15 * eO(P(t, 300, 1500)) + Math.sin(t / 900) * .015})`; });
    const fq = t - 900; $("flash").style.opacity = rank && fq >= 0 && fq < 550 ? (1 - fq / 550) * (rank === 1 ? .7 : .35) : 0;
    const cin = P(t, PANEL_IN[0], PANEL_IN[1]); panel.style.opacity = cin; panel.classList.toggle("on", t >= PANEL_IN[0]);
    if (t >= PANEL_IN[0]) rows.forEach((el, k) => { const q = eO5(P(t, PANEL_IN[0] + 250 + k * 70, PANEL_IN[0] + 250 + k * 70 + 650)); el.style.opacity = q; el.style.transform = `translateX(${(1 - q) * 40}px)`; });
  }

  // ── Запуск: звук, цикл, повтор ──
  let t0 = 0, raf = 0, playing = false;
  const frozen = new URLSearchParams(location.search).get("t");
  function loop() { const t = performance.now() - t0; renderAt(t); if (t < END) raf = requestAnimationFrame(loop); else { playing = false; $("skip").hidden = true; } }
  function sounds() {
    SND.begin();
    if (rank === 1) { SND.thump(900, 1, 90); SND.chord(900, [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], .07); }
    else if (rank) { SND.thump(900, .9, 110); SND.chord(900, [NOTE.G4, NOTE.D5, NOTE.G5], .06); }
    else { SND.thump(900, .7, 130); SND.ping(940, NOTE.A4 * 1.5, .09); }
    SND.ping(2300, NOTE.E5, .08);
    let okc = 0; [...panel.querySelectorAll(".tiles i")].forEach((e, j) => { if (e.dataset.o === "1" && j < 24) { SND.ping(PANEL_IN[0] + 400 + j * 70, [523.25, 587.33, 659.25, 783.99, 880, 1046.5][okc % 6] * (1 + Math.floor(okc / 6)), .05); okc++; } });
  }
  function run(withSound = true) { cancelAnimationFrame(raf); playing = true; $("skip").hidden = false; t0 = performance.now(); if (withSound && !reduced()) sounds(); raf = requestAnimationFrame(loop); }
  $("replay").addEventListener("click", async () => { await SND.ready(150); run(); });
  $("skip").addEventListener("click", () => { cancelAnimationFrame(raf); playing = false; $("skip").hidden = true; renderAt(END); });
  addEventListener("pointerdown", () => SND.init(), { once: true });
  let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); const t = playing ? performance.now() - t0 : (frozen != null ? +frozen : END); renderAt(t); }, 120); });
  build();
  if (frozen != null && !isNaN(+frozen)) { Tel.dataset.frozen = "1"; await (document.fonts?.ready || Promise.resolve()); build(); renderAt(+frozen); return; }
  if (reduced()) { renderAt(END); return; }
  renderAt(0);
  const askToStart = () => new Promise(done => {
    const g = document.createElement("div"); g.className = "gate";
    g.innerHTML = `<button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><b>Показати результати</b><small>Увімкнеться звук</small></button>`;
    document.body.appendChild(g); const b = g.firstElementChild; b.focus();
    b.addEventListener("click", async () => { await SND.ready(); g.remove(); done(); }, { once: true });
  });
  const [, audioOk] = await Promise.all([document.fonts?.ready || Promise.resolve(), SND.ready(300)]);
  build();
  if (!audioOk && SND.on) await askToStart();
  requestAnimationFrame(() => run());
}
</script>
