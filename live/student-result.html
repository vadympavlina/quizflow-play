<style>

  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  /* Екран «натисніть, щоб побачити результат»: показується лише коли браузер блокує звук (пряме відкриття, iPhone) */

  .gate button:hover{background:rgba(255,255,255,.16)}.gate button:focus-visible{outline:3px solid #fff;outline-offset:4px}

<body>
<div id="content"><div class="waiting"><div><div class="spinner"></div>Підраховуємо результати…</div></div></div>

<script type="module">
const MIC = {search:"<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/></svg>",alert:"<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/></svg>"};
import {
  db, ref, get, onValue, readParams, isValidCode, esc, standings,
  plural, fmtNum, pageUrl,
} from "./live-core.js?v=9";
import { A, SND, NOTE, split, odo, letters, odometer, flash, shake, rings, vib, cancelAll, reduced, POP } from "./results-fx.js?v=2";

const $ = (id) => document.getElementById(id);
const { code, pid, nickname: nickParam } = readParams("code", "pid", "nickname");
if (!isValidCode(code) || !pid) { location.replace(pageUrl("../")); throw new Error("bad params"); }
const joinAgain = pageUrl("../");

function message(ico, title, text) {
  $("content").innerHTML = `<div class="waiting"><div><div style="display:grid;place-items:center">${MIC[ico] || MIC.alert}</div><h2>${esc(title)}</h2>${esc(text)}
    <div><a class="btn" href="${esc(joinAgain)}">Приєднатись до гри</a></div></div></div>`;
}

// Чекаємо, поки викладач завершить гру (слухаємо лише статус, а не всю кімнату)
let done = false;
const unsub = onValue(ref(db, `rooms/${code}/status`), async snap => {
  if (done) return;
  const status = snap.val();
  if (!status) { done = true; unsub(); message("search", "Гру не знайдено", "Можливо, кімнату вже видалено."); return; }
  if (status !== "leaderboard" && status !== "finished") {
    // Гра ще триває (наприклад, учень відкрив посилання завчасно) — повертаємо в гру
    location.replace(`play-student?code=${code}&pid=${encodeURIComponent(pid)}&nickname=${encodeURIComponent(nickParam || "")}`);
    return;
  }
  done = true; unsub();
  try { await render(); }
  catch (e) { console.error(e); message("alert", "Не вдалося завантажити результати", e.message); }
});

async function render() {
  const [qS, pS, aS, tS, scS] = await Promise.all(["questions", "players", "answers", "testTitle", "scoring"].map(p => get(ref(db, `rooms/${code}/${p}`))));
  const totalQ = (qS.val() || []).length;
  const accMode = scS.val() === "correct";   // «Точність»: у підсумку кількість правильних, а не бали
  const allAns = aS.val() || {};
  const list = standings(pS.val(), allAns);
  const meRow = list.find(p => p.pid === pid);
  const nickname = meRow?.nickname || pS.val()?.[pid]?.nickname || nickParam || "Гравець";
  const title = tS.val() || "";

  const mine = {};
  Object.entries(allAns).forEach(([qi, qA]) => { if (qA?.[pid]) mine[+qi] = qA[pid]; });
  const correct = Object.values(mine).filter(a => a.isCorrect).length;
  const place = meRow?.rank;
  const val = p => accMode ? p.correct : p.score;
  const S = p => accMode ? `${p.correct} / ${totalQ}` : fmtNum(p.score);
  const mx = Math.max(1, ...list.map(val));
  const meI = meRow ? list.indexOf(meRow) : -1;     // позиція в списку (для нічиїх лишається місце за rank)
  const cls = place && place <= 3 ? "t" + place : "t0";
  const podium = !!place && place <= 3;

  // Барабан: від останнього місця до вашого
  const reel = [];
  const total = list.length;
  for (let k = total; k >= (place || total); k--) reel.push(k);
  if (reel.length < 2) reel.unshift(total + 1 > 1 ? total : 1);

  // Місце серед інших: лідер, сусіди, ви
  const show = new Set([0]);
  if (meI >= 0) { [meI - 1, meI, meI + 1].forEach(i => show.add(i)); if (meI <= 2) [0, 1, 2].forEach(i => show.add(i)); }
  else [1, 2].forEach(i => show.add(i));
  const idx = [...show].filter(i => i >= 0 && i < list.length).sort((a, b) => a - b);
  const gw = n => `ще ${n} ${plural(n, "гравець", "гравці", "гравців")}`;
  const dl = p => { const d = val(p) - (meRow ? val(meRow) : 0); if (!d) return "="; return d > 0 ? "+" + (accMode ? d : fmtNum(d)) : "\u2212" + (accMode ? -d : fmtNum(-d)); };
  let lad = "";
  idx.forEach((i, j) => {
    if (j && i - idx[j - 1] > 1) lad += `<div class="gp">${gw(i - idx[j - 1] - 1)}</div>`;
    const p = list[i], me = i === meI;
    lad += `<div class="rw${me ? " me" : ""}"><span class="f" style="width:${val(p) / mx * 100}%"></span><span class="k">${p.rank}</span><span class="n">${esc(p.nickname)}</span><span class="d">${me ? "ви" : dl(p)}</span><span class="v">${S(p)}</span></div>`;
  });
  if (idx.length && idx[idx.length - 1] < list.length - 1) lad += `<div class="gp">${gw(list.length - 1 - idx[idx.length - 1])}</div>`;

  // Відстань до місця вище
  const above = meI > 0 ? list.slice(0, meI).reverse().find(p => p.rank < place) : null;
  const gap = above ? val(above) - val(meRow) : 0;
  const gapText = !meRow ? "" : !above ? "Ви на першому місці"
    : accMode ? `До ${above.rank} місця: ${gap} ${plural(gap, "відповідь", "відповіді", "відповідей")}` : `До ${above.rank} місця: ${fmtNum(gap)} ${plural(gap, "бал", "бали", "балів")}`;

  const pips = Array.from({ length: totalQ }, (_, i) => { const a = mine[i]; return `<i class="${!a ? "n" : a.isCorrect ? "" : "x"}"></i>`; }).join("");
  const tiles = Array.from({ length: totalQ }, (_, i) => { const a = mine[i]; return `<div class="${!a ? "" : a.isCorrect ? "y" : "x"}" data-o="${!a ? 2 : a.isCorrect ? 1 : 0}">${i + 1}</div>`; }).join("");

  $("content").innerHTML = `<div class="S ${cls}" id="S"><section class="hero"><div class="bg"></div>
      <div class="q">${esc(title)}</div>
      <span class="big${(place || 0) >= 10 ? " two" : ""}"><span class="rs" style="display:block">${reel.map(k => `<div>${k}</div>`).join("")}</span></span>
      <span class="wait">Рахуємо результати</span>
      <div class="bot">
        <div class="of">${split(place ? `${place} місце із ${list.length} ${plural(list.length, "гравця", "гравців", "гравців")}` : "Результат")}</div>
        <div class="nm">${split(nickname)}</div>
        <div class="sc"><span class="odo">${odo(meRow ? S(meRow) : "0")}</span><small>${accMode ? "правильних" : "балів"}</small></div>
        <div class="gap">${esc(gapText)}</div>
        ${totalQ ? `<div class="pips">${pips}</div>` : ""}
      </div></section>
    <section class="side">${totalQ ? `<div class="ans${totalQ > 24 ? " many" : ""}">${tiles}</div>` : ""}<div class="lad">${lad}</div></section>
    <div class="tools"><button class="t" id="replay" type="button">Ще раз</button><button class="t" id="snd" type="button"></button><a class="t" href="${esc(joinAgain)}">До нової гри</a></div></div>`;
  const label = () => { $("snd").textContent = SND.on ? "Звук: вкл" : "Звук: вимк"; };
  label();
  $("snd").addEventListener("click", () => { SND.toggle(); label(); });
  $("replay").addEventListener("click", async () => { await SND.ready(150); run(); });   // resume() асинхронний: без очікування перший повтор мовчав
  addEventListener("pointerdown", () => SND.init(), { once: true });

  function run() {
    cancelAll();
    const Sx = $("S");
    if (reduced()) return;
    SND.begin();
    const hero = Sx.querySelector(".hero"), big = hero.querySelector(".big"), rs = hero.querySelector(".rs"), bg = hero.querySelector(".bg"), n = rs.children.length, land = 2100;
    const c2 = getComputedStyle(Sx).getPropertyValue("--c2");
    A(hero.querySelector(".wait"), [{ opacity: 0 }, { opacity: 1, offset: .2 }, { opacity: 1, offset: .9 }, { opacity: 0 }], { duration: land, easing: "linear" });
    A(hero.querySelector(".q"), [{ opacity: 0 }, { opacity: 0, offset: .9 }, { opacity: 1 }], { duration: land + 400, easing: "linear" });
    A(bg, [{ clipPath: "circle(0% at 78% 70%)" }, { clipPath: "circle(0% at 78% 70%)", offset: .001 }, { clipPath: "circle(160% at 78% 70%)" }], { duration: 800, delay: land - 50, easing: "cubic-bezier(.7,0,.2,1)" });
    A(rs, [{ transform: "translateY(0)" }, { transform: `translateY(${-(n - 1) / n * 100}%)` }], { duration: land, easing: "cubic-bezier(.12,.75,.15,1)" });
    A(big, [{ color: "#26367F" }, { color: "#26367F", offset: .95 }, { color: c2 }], { duration: land + 500, easing: "linear" });
    A(big, [{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 420, delay: land - 60, easing: "ease-out" });
    shake(Sx, podium ? 1 : .4, podium ? 480 : 300, land - 20);
    setTimeout(() => vib(podium ? [60, 40, 120] : [50]), land);
    if (podium) { flash(place === 1 ? .85 : .5, 420, land - 20); rings(hero, "78%", "70%", land, place === 1 ? 4 : 3, place === 1 ? 34 : 24); }
    if (place === 1) { SND.thump(land, 1, 90); SND.chord(land, [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], .07); [0, 1, 2, 3].forEach(k => SND.ping(land + 300 + k * 110, [NOTE.C6, NOTE.G5 * 2, NOTE.E5 * 2, NOTE.C6 * 2][k], .07)); }
    else if (podium) { SND.thump(land, .9, 110); SND.chord(land, [NOTE.G4, NOTE.D5, NOTE.G5], .06); SND.ping(land + 260, NOTE.D5 * 2, .08); }
    else { SND.thump(land, .7, 130); SND.ping(land + 40, NOTE.A4 * 1.5, .09); }
    const bot = hero.querySelector(".bot");
    A(bot, [{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: land + 150 });
    letters(bot.querySelector(".of"), land + 200, 14); letters(bot.querySelector(".nm"), land + 260);
    odometer(bot.querySelector(".odo"), land + 420, 1500);
    A(bot.querySelector(".gap"), [{ opacity: 0 }, { opacity: .88 }], { duration: 500, delay: land + 1300 });
    bot.querySelectorAll(".pips i").forEach((e, j) => A(e, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 260, delay: land + 800 + j * 60, easing: POP }));
    const tail = land + 700; let okc = 0;
    Sx.querySelectorAll(".ans div").forEach((t, j) => {
      const d = tail + j * Math.min(70, 1200 / Math.max(1, totalQ)), o = t.dataset.o;
      const col = o === "1" ? "#0E9F6E" : o === "0" ? "#E5484D" : "#22338A";
      A(t, [{ transform: "scale(.5)", opacity: 0, backgroundColor: "#22338A" }, { transform: "scale(1)", opacity: 1, backgroundColor: "#22338A", offset: .4 }, { transform: "scale(1)", opacity: 1, backgroundColor: col }], { duration: 560, delay: d, easing: POP });
      if (o === "1" && j < 24) { SND.ping(d + 240, [523.25, 587.33, 659.25, 783.99, 880, 1046.5][okc % 6] * (1 + Math.floor(okc / 6)), .05); okc++; }
    });
    Sx.querySelectorAll(".lad .rw,.lad .gp").forEach((e, j) => {
      const d = tail + 700 + j * 110, me = e.classList.contains("me");
      A(e, [{ opacity: 0, transform: "translateX(-26px)" }, { opacity: 1, transform: "none" }], { duration: 480, delay: d });
      const f = e.querySelector(".f"); if (f) A(f, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 900, delay: d + 150, easing: "cubic-bezier(.2,.8,.2,1)" });
      if (me) { A(e, [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 700, delay: d + 200, easing: "cubic-bezier(.7,0,.2,1)" }); SND.ping(d + 700, NOTE.E5, .08); }
    });
    // Дотик чи клік по екрану анімацію НЕ перериває: її легко скасувати випадково, а переглянути ще раз можна кнопкою «Ще раз»
  }
  // Звук без жесту користувача браузер не вмикає. Якщо він заблокований (сторінку відкрито напряму, iPhone), не запускаємо
  // церемонію мовчки, а просимо торкнутись: цей дотик і вмикає звук, і запускає показ (тож його не можна «проґавити»).
  const askToStart = () => new Promise(done => {
    const g = document.createElement("div");
    g.className = "gate";
    g.innerHTML = `<button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><b>Показати результати</b><small>Увімкнеться звук</small></button>`;
    document.body.appendChild(g);
    const b = g.firstElementChild;
    b.focus();
    b.addEventListener("click", async () => { await SND.ready(); g.remove(); done(); }, { once: true });
  });
  Promise.all([document.fonts?.ready || Promise.resolve(), SND.ready(300)]).then(async ([, audioOk]) => {
    if (!audioOk && SND.on && !reduced()) await askToStart();
    requestAnimationFrame(run);
  });

}
