<style>
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));touch-action:manipulation}
  .wrap{position:relative;z-index:1;width:100%;max-width:420px}
  .lv-brand{justify-content:center;margin-bottom:22px}
  .lv-brand .logo.mk{width:44px;height:44px;background:none;box-shadow:none;border-radius:0}
  .lv-brand .logo.mk img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
  .lv-card{padding:26px 24px;animation:cardIn .4s cubic-bezier(.22,1,.36,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:-.015em}
  .sub{margin:0 0 20px;color:var(--ink-2);font-size:14.5px;line-height:1.45}

  .code-input{font:700 30px var(--mono);letter-spacing:.14em;text-align:center;padding:14px 10px;border-radius:14px}
  .code-input::placeholder{color:var(--line-2);letter-spacing:.14em}

  .room{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);margin-bottom:18px}
  .room .ico{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 auto}
  .room .t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
  .room .m{font:600 12px var(--mono);color:var(--ink-3);margin-top:2px}
  .room button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:6px}

  .nick-row{display:flex;gap:12px;align-items:center}
  .av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;pointer-events:none;-webkit-user-drag:none}
  .av svg{width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none}
  .nick-row .av{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:0 0 auto;background:var(--line-2);transition:background .2s;overflow:hidden}
  .av-btn{position:relative;appearance:none;border:0;padding:0;background:none;cursor:pointer;flex:0 0 auto;border-radius:18px;-webkit-tap-highlight-color:transparent}
  .av-btn .av{width:64px;height:64px;border-radius:18px;overflow:hidden;transition:transform .15s}
  .av-btn:active .av{transform:scale(.95)}
  .av-btn .edit{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 2px 6px rgba(40,30,120,.3)}
  .av-btn .edit svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .av-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .av-hint{font-size:12.5px;color:var(--ink-3);margin-top:8px}
  .av-hint button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
  /* Вікно вибору героя: знизу на телефоні, по центру на комп'ютері */
  .sheet-back{position:fixed;inset:0;z-index:50;background:rgba(20,14,60,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:460px;max-height:min(88dvh,640px);background:var(--card);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -20px 60px rgba(20,14,60,.35)}
  .sheet-back.open .sheet{transform:none}
  @media (min-width:600px){.sheet-back{align-items:center}.sheet{border-radius:26px;max-height:min(86vh,680px)}}
  .sheet-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
  .sheet-top h2{margin:0;font-size:18px}
  .sheet-x{appearance:none;border:0;background:var(--card-2);color:var(--ink-2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  .sheet-x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
  .sheet-x:focus-visible,.sheet .lv-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .sheet-body{overflow-y:auto;padding:12px 18px 12px;overscroll-behavior:contain}
  .prev{display:flex;align-items:center;gap:14px;padding:6px 18px 12px;border-bottom:1px solid var(--line)}
  .prev .av{width:84px;height:84px;border-radius:24px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center}
  .prev b{display:block;font-size:19px}
  .prev span{font-size:13px;color:var(--ink-3)}
  .sh-lbl{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 8px}
  .heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:3px;margin:0 -3px}
  .hero-btn{appearance:none;border:2px solid transparent;border-radius:16px;padding:0;aspect-ratio:1;cursor:pointer;overflow:hidden;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
  .hero-btn img,.hero-btn svg,.gl-btn img,.gl-btn svg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
  .hero-btn[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,79,232,.28);transform:scale(1.05);z-index:1}
  .hero-btn:focus-visible,.gl-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .gls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:3px;margin:0 -3px 4px}
  .gl-btn{appearance:none;border:2px solid transparent;border-radius:16px;padding:0;aspect-ratio:1;cursor:pointer;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink-3);transition:transform .15s,border-color .15s,box-shadow .15s}
  .gl-btn[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,79,232,.28);transform:scale(1.05);z-index:1}
  .sheet-foot{padding:10px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line)}
  .sheet-foot .lv-btn{flex:1}
  @media (prefers-reduced-motion:reduce){.sheet-back,.sheet{transition:none}}

  .counter{text-align:right;font:500 11.5px var(--mono);color:var(--ink-3);margin-top:6px}

  .err{margin-top:14px;padding:11px 13px;border-radius:12px;background:#FDECEC;border:1px solid #F3C1C1;color:#9B2C2C;font-size:13.5px;font-weight:600}
  .info{margin-top:14px;padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent-2);font-size:13px;font-weight:600}
  .actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .resume{margin-bottom:16px;padding:14px;border-radius:14px;border:1.5px solid rgba(91,79,232,.3);background:var(--accent-soft)}
  .resume p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
  .resume p b{color:var(--ink)}
  .foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--ink-3)}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
<style id="no-zoom">/* iOS збільшує сторінку, якщо в полі вводу шрифт менше 16px; тут цього не буває */@media (pointer:coarse){input,textarea,select,[contenteditable="true"],[contenteditable=""]{font-size:16px!important}html{touch-action:manipulation;-webkit-text-size-adjust:100%}}</style>

<body>
<div class="wrap">
  <div class="lv-brand"><span class="logo mk"><img src="assets/icons/game/rabbit.webp" alt="" width="44" height="44" draggable="false"></span>quizflow&nbsp;<span>live</span></div>

  <!-- Крок 1: код -->
  <form class="lv-card" id="step-code" autocomplete="off" novalidate>
    <h1>Приєднатись до гри</h1>
    <p class="sub">Введіть код, який показує викладач на екрані</p>
    <label class="lv-label" for="inp-code">Код гри</label>
    <input class="lv-input code-input" id="inp-code" inputmode="numeric" autocomplete="one-time-code" placeholder="0000 0000" maxlength="9" enterkeyhint="next">
    <div class="err" id="err-code" hidden></div>
    <div class="actions"><button class="lv-btn primary big block" id="btn-code" type="submit">Далі →</button></div>
  </form>

  <!-- Крок 2: нік -->
  <form class="lv-card" id="step-nick" autocomplete="off" novalidate hidden>
    <div class="room">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
      <div style="min-width:0"><div class="t" id="room-title">—</div><div class="m" id="room-meta">—</div></div>
      <button type="button" id="change-code" hidden>Інший код</button>
    </div>
    <div class="resume" id="resume" hidden>
      <p>Ви вже в цій грі як <b id="resume-name"></b></p>
      <button class="lv-btn primary block" type="button" id="resume-btn">Продовжити →</button>
    </div>
    <label class="lv-label" for="inp-nick">Ваше ім'я в грі</label>
    <div class="nick-row">
      <button type="button" class="av-btn" id="av-open" aria-label="Обрати героя" aria-haspopup="dialog"><div class="av" id="nick-av" aria-hidden="true">?</div><span class="edit" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></span></button>
      <input class="lv-input" id="inp-nick" placeholder="Напр. Олена К." maxlength="24" autocomplete="nickname" enterkeyhint="go">
    </div>
    <div class="counter" id="nick-count">0 / 24</div>
    <div class="av-hint">Герой: <b id="hero-name"></b> · <button type="button" id="av-open2">змінити</button></div>
    <div class="info" id="info-running" hidden>Гра вже йде — ви приєднаєтесь з поточного питання</div>
    <div class="err" id="err-nick" hidden></div>
    <div class="actions"><button class="lv-btn primary big block" id="btn-join" type="submit">Приєднатись</button></div>
  </form>

  <div class="foot">Викладач бачить ваше ім'я — пишіть справжнє</div>
</div>

<div class="sheet-back" id="sheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-top"><h2 id="sheet-title">Ваш герой</h2><button type="button" class="sheet-x" id="sheet-x" aria-label="Закрити"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="prev"><div class="av" id="prev-av"></div><div><b id="prev-name"></b><span>Видно викладачу й усім у грі. Лише на цю гру.</span></div></div>
    <div class="sheet-body">

      <div class="sh-lbl" id="hero-lbl">Герой</div>
      <div class="heroes" id="heroes" role="radiogroup" aria-labelledby="hero-lbl"></div>
      <div class="sh-lbl" id="gl-lbl" style="margin-top:14px">Окуляри</div>
      <div class="gls" id="glasses" role="radiogroup" aria-labelledby="gl-lbl"></div>
    </div>
    <div class="sheet-foot"><button type="button" class="lv-btn" id="sheet-rnd">Випадковий</button><button type="button" class="lv-btn primary" id="sheet-ok">Готово</button></div>
  </div>
</div>

<script type="module">
import { db, ref, get, set, serverTimestamp, esc, initialsOf, avatarColor, isValidCode, safeStore, plural, AVATARS, GLASSES, avatarFill, avatarInner, avatarInfo, randomAvatar } from "./live/live-core.js?v=8";

const $ = (id) => document.getElementById(id);
const urlCode = (new URLSearchParams(location.search).get("code") || "").replace(/\D/g, "");
let code = null, room = null;

const show = (el, msg) => { el.textContent = msg; el.hidden = !msg; };
function fail(input, errEl, msg) {
  show(errEl, msg);
  input.classList.add("bad", "shake");
  setTimeout(() => input.classList.remove("shake"), 400);
  input.focus();
}
function busy(btn, on, label) {
  btn.disabled = on;
  btn.innerHTML = on ? `<span class="lv-spin"></span> ${label}` : label;
}
const goPlay = (pid, nick) => location.href = `live/play-student?code=${code}&pid=${encodeURIComponent(pid)}&nickname=${encodeURIComponent(nick)}`;
const storeKey = (c) => `qf-live-me-${c}`;

// ─── Крок 1: код ───────────────────────────────────────────────────────
const codeInp = $("inp-code");
codeInp.addEventListener("input", () => {
  const d = codeInp.value.replace(/\D/g, "").slice(0, 8);
  codeInp.value = d.length > 4 ? d.slice(0, 4) + " " + d.slice(4) : d;
  codeInp.classList.remove("bad"); show($("err-code"), "");
  if (d.length === 8) checkCode(d);          // автоматично — без зайвого натискання
});
$("step-code").addEventListener("submit", (e) => { e.preventDefault(); checkCode(codeInp.value.replace(/\D/g, "")); });

let checking = false;
async function checkCode(c) {
  if (checking) return;
  if (!isValidCode(c)) return fail(codeInp, $("err-code"), "Код складається з 8 цифр");
  checking = true; busy($("btn-code"), true, "Шукаємо гру…");
  try {
    const [st, title, qCount, players, svc] = await Promise.all([
      ...["status", "testTitle", "qCount", "players"].map(p => get(ref(db, `rooms/${c}/${p}`)).then(s => s.val())),
      get(ref(db, "settings/status")).then(s => s.val()).catch(() => null)]);   // режим техробіт
    if (svc?.gamesOff === true) return fail(codeInp, $("err-code"), svc.message || "Ігри тимчасово недоступні: тривають технічні роботи.");
    if (!st) return fail(codeInp, $("err-code"), "Гру з таким кодом не знайдено. Перевірте цифри.");
    if (st === "finished" || st === "leaderboard") return fail(codeInp, $("err-code"), "Ця гра вже завершилась.");
    // Старі кімнати без qCount — рахуємо питання як раніше
    const total = qCount ?? ((await get(ref(db, `rooms/${c}/questions`))).val() || []).length;
    code = c; room = { status: st, title, total, players: players || {} };
    openNickStep();
  } catch (e) {
    fail(codeInp, $("err-code"), "Немає з'єднання. Спробуйте ще раз.");
  } finally { checking = false; busy($("btn-code"), false, "Далі →"); }
}

// ─── Крок 2: нік ───────────────────────────────────────────────────────
const nickInp = $("inp-nick");
const normNick = (s) => s.replace(/\s+/g, " ").trim();
let hero = "", gls = "";   // обране: діє лише в цій грі, на пристрої не запам'ятовується
function paintAvatar() {
  const n = normNick(nickInp.value);
  $("nick-av").innerHTML = hero ? avatarInner(n, hero, { glasses: gls }) : (n ? initialsOf(n) : "?");
  $("nick-av").style.background = hero ? avatarFill(n, hero) : (n ? avatarColor(n) : "");
  $("nick-count").textContent = `${nickInp.value.length} / 24`;
  nickInp.classList.remove("bad"); show($("err-nick"), "");
}
nickInp.addEventListener("input", paintAvatar);

// ─── Вікно вибору героя й окулярів ───
const sheet = $("sheet");
let lastFocus = null;
const hname = () => avatarInfo(hero)?.name || "";
function paintSheet() {
  $("prev-av").innerHTML = avatarInner("", hero, { glasses: gls }); $("prev-av").style.background = avatarInfo(hero)?.bg || "";
  $("prev-name").textContent = hname() + (gls ? " · " + (GLASSES.find(g => g.id === gls)?.name || "") : "");
  document.querySelectorAll("#heroes .hero-btn").forEach(b => b.setAttribute("aria-checked", b.dataset.id === hero));
  $("glasses").innerHTML = glBtn("", "Без окулярів", "без") + GLASSES.map(g => glBtn(g.id, g.name, avatarInner("", hero, { glasses: g.id }))).join("");
  document.querySelectorAll("#glasses .gl-btn").forEach(b => { b.setAttribute("aria-checked", b.dataset.id === gls); b.style.background = avatarInfo(hero)?.bg || ""; });
  $("hero-name").textContent = hname();
  paintAvatar();
}
const glBtn = (id, name, inner) => `<button type="button" class="gl-btn" role="radio" aria-checked="false" data-id="${id}" aria-label="${name}" title="${name}">${inner}</button>`;
function pickHero(id) { hero = id; paintSheet(); }
$("heroes").innerHTML = AVATARS.map(a => `<button type="button" class="hero-btn" role="radio" aria-checked="false" data-id="${a.id}" aria-label="${a.name}" title="${a.name}" style="background:${a.bg}">${avatarInner("", a.id)}</button>`).join("");
$("heroes").addEventListener("click", (e) => { const b = e.target.closest(".hero-btn"); if (b) pickHero(b.dataset.id); });
$("glasses").addEventListener("click", (e) => { const b = e.target.closest(".gl-btn"); if (b) { gls = b.dataset.id; paintSheet(); } });
$("heroes").addEventListener("keydown", (e) => {
  const bs = [...document.querySelectorAll("#heroes .hero-btn")], i = bs.indexOf(document.activeElement);
  if (i < 0 || !["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key)) return;
  e.preventDefault(); const nx = bs[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length]; nx.focus(); pickHero(nx.dataset.id);
});
function openSheet() {
  lastFocus = document.activeElement; sheet.setAttribute("aria-hidden", "false"); sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => $("sheet-ok").focus({ preventScroll: true }), 60);
}
function closeSheet() {
  sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
  (lastFocus && lastFocus.isConnected ? lastFocus : $("av-open")).focus?.();
}
$("av-open").addEventListener("click", openSheet); $("av-open2").addEventListener("click", openSheet);
$("sheet-ok").addEventListener("click", closeSheet); $("sheet-x").addEventListener("click", closeSheet);
$("sheet-rnd").addEventListener("click", () => { gls = ""; pickHero(randomAvatar()); });
sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", (e) => {
  if (!sheet.classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
  if (e.key === "Tab") {   // фокус не виходить за межі вікна
    const f = [...sheet.querySelectorAll("button")].filter(b => b.offsetParent !== null), a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});

function openNickStep() {
  $("step-code").hidden = true; $("step-nick").hidden = false;
  $("room-title").textContent = room.title || "Гра QuizFlow";
  $("room-meta").textContent = `код ${code.slice(0, 4)} ${code.slice(4)} · ${room.total} ${plural(room.total, "питання", "питання", "питань")}`;
  $("info-running").hidden = room.status === "lobby";
  history.replaceState(null, "", `?code=${code}`);

  // Повернення в гру після закритої вкладки / перезавантаження
  const me = safeStore.get(storeKey(code));
  const p = me && room.players[me.pid];
  if (p && p.active !== false) {
    $("resume-name").textContent = p.nickname;
    $("resume").hidden = false;
    $("resume-btn").onclick = () => goPlay(me.pid, p.nickname);
  }
  nickInp.value = safeStore.get("qf-live-nick", "") || "";
  pickHero(randomAvatar());   // кожна гра — новий випадковий герой, учень може змінити
  setTimeout(() => nickInp.focus(), 50);
}
$("change-code").hidden = false;
$("change-code").addEventListener("click", () => {
  $("step-nick").hidden = true; $("step-code").hidden = false; $("resume").hidden = true;
  codeInp.value = ""; history.replaceState(null, "", location.pathname); codeInp.focus();
});

$("step-nick").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nick = normNick(nickInp.value);
  if (nick.length < 2) return fail(nickInp, $("err-nick"), "Ім'я має містити щонайменше 2 символи");
  const btn = $("btn-join");
  busy(btn, true, "Підключаємось…");
  try {
    // Свіжий список гравців — хтось міг зайняти нік, поки ми вводили
    const [st, players] = await Promise.all([
      get(ref(db, `rooms/${code}/status`)).then(s => s.val()),
      get(ref(db, `rooms/${code}/players`)).then(s => s.val() || {}),
    ]);
    if (!st || st === "finished" || st === "leaderboard") return fail(nickInp, $("err-nick"), "Гра вже завершилась.");
    const me = safeStore.get(storeKey(code));
    const same = Object.entries(players).find(([, p]) => (p?.nickname || "").toLowerCase() === nick.toLowerCase());
    if (same) {
      const [pid, p] = same;
      if (p.active === false) return fail(nickInp, $("err-nick"), "Гравця з цим ім'ям викладач видалив з гри.");
      // Власний запис (той самий пристрій) — просто повертаємось. Чужий — не даємо перехопити.
      if (me?.pid === pid) { goPlay(pid, p.nickname); return; }
      return fail(nickInp, $("err-nick"), "Це ім'я вже зайняте — додайте прізвище або першу літеру.");
    }
    const pid = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    await set(ref(db, `rooms/${code}/players/${pid}`), { nickname: nick, joinedAt: serverTimestamp(), active: true, online: true, ...(hero ? { avatar: hero } : {}), ...(hero && gls ? { glasses: gls } : {}) });
    safeStore.set(storeKey(code), { pid });
    safeStore.set("qf-live-nick", nick);
    goPlay(pid, nick);
  } catch (err) {
    fail(nickInp, $("err-nick"), "Не вдалося приєднатись: " + err.message);
  } finally { busy(btn, false, "Приєднатись"); }
});

if (urlCode) { codeInp.value = urlCode; checkCode(urlCode); }
else codeInp.focus();
</script>
